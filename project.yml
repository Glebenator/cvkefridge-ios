# XcodeGen project for the iOS app. Run `xcodegen generate` in this folder to make CVKEFridge.xcodeproj.
# The generated project is not in Git. See README.md.
name: CVKEFridge
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
packages:
  CVKEFridgeCore:
    path: CVKEFridgeCore
targets:
  CVKEFridge:
    type: application
    platform: iOS
    sources:
      - path: CVKEFridge
      # The two tables of the shared specification go into the app as they are. Do not copy them: spec/ is the
      # reference (see AGENTS.md).
      - path: spec/foods.json
        buildPhase: resources
      - path: spec/storage-hints.json
        buildPhase: resources
    dependencies:
      - package: CVKEFridgeCore
        product: CVKEFridgeCore
      - package: CVKEFridgeCore
        product: CVKEFridgeFeatures
    info:
      path: CVKEFridge/Info.plist
      properties:
        CFBundleDisplayName: CVKE Fridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: CVKE Fridge uses the camera only to read barcodes and to take a photo of a food. The picture stays on your iPhone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cvkefridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  # The unit tests of the app code that needs the system: they run in the app, on a simulator. The tests of the
  # product rules are in the CVKEFridgeCore package.
  CVKEFridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CVKEFridgeTests
    dependencies:
      - target: CVKEFridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cvkefridge.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CVKEFridge.app/CVKEFridge
        BUNDLE_LOADER: $(TEST_HOST)
  CVKEFridgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CVKEFridgeUITests
    dependencies:
      - target: CVKEFridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cvkefridge.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CVKEFridge
schemes:
  CVKEFridge:
    build:
      targets:
        CVKEFridge: all
        CVKEFridgeTests: [test]
        CVKEFridgeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: CVKEFridgeTests
        - name: CVKEFridgeUITests
    archive:
      config: Release
