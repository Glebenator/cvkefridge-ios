# Tests the Swift package, builds the iOS app with Xcode, and runs the start screen test on a simulator.
# The test runs in light and in dark appearance. Its screenshots are an artifact.
name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show the toolchain
        run: xcodebuild -version && swift --version
      - name: Test the product rules
        working-directory: CVKEFridgeCore
        run: swift test

  app:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and the simulators
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Choose a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for runtime, list_ in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in list_]
          phones = [d for d in devices if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]] or \
                   [d for d in devices if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"])')
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build
        id: build
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project CVKEFridge.xcodeproj -scheme CVKEFridge \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning:|BUILD|\*\*" || true
          grep -q "TEST BUILD SUCCEEDED" build.log
      - name: Show build errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -150 || true
          # A compiler crash has no error line. Its stack dump names the file and the function.
          grep -E "While (evaluating|emitting|type-checking)|Apple Swift version" build.log | head -20 || true
      - name: Run the start screen test in light mode
        id: light
        run: |
          set -o pipefail
          xcrun simctl ui "${{ steps.sim.outputs.udid }}" appearance light
          xcodebuild test-without-building -project CVKEFridge.xcodeproj -scheme CVKEFridge \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            -only-testing:CVKEFridgeUITests/StartUITests/test1StartScreen -resultBundlePath light.xcresult | tail -40
      - name: Run the start screen test in dark mode
        if: always() && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          xcrun simctl ui "${{ steps.sim.outputs.udid }}" appearance dark
          xcodebuild test-without-building -project CVKEFridge.xcodeproj -scheme CVKEFridge \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            -only-testing:CVKEFridgeUITests/StartUITests/test1StartScreen -resultBundlePath dark.xcresult | tail -40
      - name: Export the screenshots
        if: always()
        run: |
          for run in light dark; do
            if [ -d "$run.xcresult" ]; then
              xcrun xcresulttool export attachments --path "$run.xcresult" --output-path "attachments-$run" || true
              [ -f "attachments-$run/manifest.json" ] && python3 scripts/export-captures.py "attachments-$run" captures "$run" || true
            fi
          done
          ls -la captures || true
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-captures
          path: captures
          if-no-files-found: warn
      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-results
          path: |
            *.xcresult
            build.log
          if-no-files-found: ignore
