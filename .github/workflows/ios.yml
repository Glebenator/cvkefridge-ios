# Compares the copy of the shared specification in spec/ with the cvkefridge repository, tests the Swift package
# with the vectors in spec/vectors/, builds the iOS app with Xcode, and runs the unit tests of the app and all UI
# tests on a simulator. The UI tests run in light and in dark appearance, in two jobs at the same time. Their
# screenshots are an artifact of each job.
name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check the copy of the shared specification
        run: python3 scripts/update-spec.py --check
      - name: Show the toolchain
        run: xcodebuild -version && swift --version
      - name: Test the product rules
        working-directory: CVKEFridgeCore
        run: swift test

  app:
    name: app (${{ matrix.appearance }})
    runs-on: macos-26
    # One job for each appearance, at the same time. Each job builds the app and runs all UI tests one time. The
    # light job also runs the unit tests of the app. The tests in one job run one at a time: the UI tests share the
    # simulator and the notification permission of the app.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        appearance: [light, dark]
    env:
      XCODEGEN_VERSION: "2.46.0"
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and the simulators
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Generate the project
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
      - name: Choose a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for runtime, list_ in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in list_]
          phones = [d for d in devices if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]] or \
                   [d for d in devices if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"])')
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build
        id: build
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project CVKEFridge.xcodeproj -scheme CVKEFridge \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning:|BUILD|\*\*" || true
          grep -q "TEST BUILD SUCCEEDED" build.log
      - name: Show build errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -150 || true
          # A compiler crash has no error line. Its stack dump names the file and the function.
          grep -E "While (evaluating|emitting|type-checking)|Apple Swift version" build.log | head -20 || true
      - name: Run the unit tests of the app
        id: unit
        if: matrix.appearance == 'light'
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild test-without-building -project CVKEFridge.xcodeproj -scheme CVKEFridge \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build -parallel-testing-enabled NO \
            -only-testing:CVKEFridgeTests -resultBundlePath unit.xcresult | tee unit.log | tail -40
      # Each UI test class runs: the shell, Home and My Fridge, the screen of a food, the forms, the scanner, History,
      # the settings, and the photos. The tests start the app with a data folder of their own and with no network.
      - name: Run the UI tests in ${{ matrix.appearance }} mode
        id: ui
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 75
        run: |
          set -o pipefail
          xcrun simctl ui "${{ steps.sim.outputs.udid }}" appearance "${{ matrix.appearance }}"
          xcodebuild test-without-building -project CVKEFridge.xcodeproj -scheme CVKEFridge \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build -parallel-testing-enabled NO \
            -only-testing:CVKEFridgeUITests -resultBundlePath "${{ matrix.appearance }}.xcresult" \
            | tee "${{ matrix.appearance }}.log" | tail -40
      - name: Show the tests that failed
        if: failure()
        run: |
          for run in unit "${{ matrix.appearance }}"; do
            if [ -f "$run.log" ]; then
              echo "== $run"
              grep -E "^Test Case .* (failed|skipped)|: error: " "$run.log" | sort -u | head -80 || true
            fi
          done
      - name: Export the screenshots
        if: always()
        run: |
          run="${{ matrix.appearance }}"
          if [ -d "$run.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$run.xcresult" --output-path "attachments-$run" || true
            [ -f "attachments-$run/manifest.json" ] && python3 scripts/export-captures.py "attachments-$run" captures "$run" || true
          fi
          ls -la captures || true
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-captures-${{ matrix.appearance }}
          path: captures
          if-no-files-found: warn
      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-results-${{ matrix.appearance }}
          path: |
            *.xcresult
            *.log
          if-no-files-found: ignore
